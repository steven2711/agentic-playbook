name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: cli/.nvmrc
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - name: Typecheck, test, build, lint playbook
        run: npm run check
        working-directory: cli
      - name: Bundled CLI is up to date
        run: git diff --exit-code -- cli/dist
