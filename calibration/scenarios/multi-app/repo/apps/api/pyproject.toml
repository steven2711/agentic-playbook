[project]
name = "atlas-api"
version = "0.9.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6", "uvicorn==0.34.0", "sqlalchemy==2.0.36", "pyjwt==2.10.1"]

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1", "ruff==0.8.4", "mypy==1.14.0"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
